services:

  # ==================================================
  # PostgreSQL Database
  # ==================================================
  notification-postgres:
    container_name: notification-postgres
    image: postgres:17-alpine

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - notification-network

  # ==================================================
  # Redis
  # ==================================================
  notification-redis:
    container_name: notification-redis
    image: redis:7-alpine

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${REDIS_PORT}:6379"

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf

    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - notification-network

  # ==================================================
  # FastAPI Backend
  # ==================================================
  notification-api:
    container_name: notification-api

    build:
      context: ./backend

    working_dir: /app

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      notification-postgres:
        condition: service_healthy

      notification-redis:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT}:8000"

    volumes:
      - ./backend:/app

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    networks:
      - notification-network

  # ==================================================
  # Celery Worker
  # ==================================================
  notification-worker:
    container_name: notification-worker

    build:
      context: ./backend

    working_dir: /app

    entrypoint:
      - ./worker-entrypoint.sh

    env_file:
      - .env

    depends_on:
      notification-postgres:
        condition: service_healthy

      notification-redis:
        condition: service_healthy

      notification-api:
        condition: service_started

    restart: unless-stopped

    volumes:
      - ./backend:/app

    networks:
      - notification-network

  # ==================================================
  # React Frontend
  # ==================================================
  notification-frontend:
    container_name: notification-frontend

    build:
      context: ./frontend

    working_dir: /app

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${FRONTEND_PORT}:5173"

    volumes:
      - ./frontend:/app

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - notification-network

  # ==================================================
  # Nginx Reverse Proxy
  # ==================================================
  notification-nginx:
    container_name: notification-nginx

    build:
      context: ./docker/nginx

    restart: unless-stopped

    depends_on:
      notification-api:
        condition: service_healthy

      notification-frontend:
        condition: service_healthy

    ports:
      - "${NGINX_PORT}:80"

    networks:
      - notification-network

# ==================================================
# Persistent Volumes
# ==================================================
volumes:
  postgres_data:
    name: notification-postgres-data

# ==================================================
# Internal Network
# ==================================================
networks:
  notification-network:
    name: notification-network
    driver: bridge
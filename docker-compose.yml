services:

  notification-postgres:
    container_name: notification-postgres

    image: postgres:17-alpine

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - notification-network


  notification-redis:
    container_name: notification-redis

    image: redis:7-alpine

    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf

    command:
      redis-server /usr/local/etc/redis/redis.conf

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - notification-network    

  notification-api:

    working_dir: /app

    container_name: notification-api

    build:
      context: ./backend

    restart: unless-stopped

    env_file:
      - .env

    depends_on:

      notification-postgres:
        condition: service_healthy

      notification-redis:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT}:8000"

    volumes:
      - ./backend:/app

    networks:
      - notification-network

  notification-worker:

    working_dir: /app

    container_name: notification-worker

    build:
      context: ./backend

    restart: unless-stopped

    env_file:
      - .env

    depends_on:

      depends_on:
        notification-postgres:
          condition: service_healthy

        notification-redis:
          condition: service_healthy

        notification-api:
          condition: service_started

    command:

      celery -A app.workers.worker worker --loglevel=info

    volumes:
      - ./backend:/app

    networks:
      - notification-network        


  notification-frontend:

    working_dir: /app

    container_name: notification-frontend

    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT}:5173"

    volumes:
      - ./frontend:/app

    networks:
      - notification-network    

  notification-nginx:
    container_name: notification-nginx

    build:
      context: ./docker/nginx

    restart: unless-stopped

    depends_on:
      notification-api:
        condition: service_healthy

      notification-frontend:
        condition: service_started

    ports:

      - "${NGINX_PORT}:80"

    networks:
      - notification-network    

  volumes:
  
    postgres_data:
    
      name: notification-postgres-data    

  networks:

    notification-network:

      name: notification-network

      driver: bridge

  env_file:
    - .env      

  healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  interval: 30s
  timeout: 10s
  retries: 3
services:

  # ==================================================
  # PostgreSQL Database (internal only)
  # ==================================================
  notification-postgres:
    container_name: notification-postgres
    image: postgres:17-alpine

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - notification-network

    # Production: no host port published; internal only
    # Production: no development bind mount

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================================================
  # Redis (internal only)
  # ==================================================
  notification-redis:
    container_name: notification-redis
    image: redis:7-alpine

    restart: unless-stopped

    env_file:
      - .env

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf

    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - notification-network

    # Production: no host port published; internal only

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================================================
  # FastAPI Backend (internal only)
  # ==================================================
  notification-api:
    container_name: notification-api

    build:
      context: ./backend
      dockerfile: Dockerfile

    working_dir: /app

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      notification-postgres:
        condition: service_healthy

      notification-redis:
        condition: service_healthy

    # Production: no host port published; nginx is the entry point
    # Production: no development bind mount; uses built image

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - notification-network

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================================================
  # Celery Worker (internal only)
  # ==================================================
  notification-worker:
    container_name: notification-worker

    build:
      context: ./backend
      dockerfile: Dockerfile

    working_dir: /app

    entrypoint:
      - ./worker-entrypoint.sh

    env_file:
      - .env

    depends_on:
      notification-postgres:
        condition: service_healthy

      notification-redis:
        condition: service_healthy

      notification-api:
        condition: service_healthy

    restart: unless-stopped

    # Production: no development bind mount; uses built image

    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.worker.celery_app", "inspect", "--timeout", "10", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

    networks:
      - notification-network

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================================================
  # React Frontend (internal only — served via production build)
  # ==================================================
  notification-frontend:
    container_name: notification-frontend

    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    # Production: no host port published; nginx is the entry point
    # Production: no development bind mount; uses built production image

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - notification-network

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 64M
    mem_limit: 128m
    mem_reservation: 64m
    cpus: "0.5"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================================================
  # Nginx Reverse Proxy (only service exposed on host)
  # ==================================================
  notification-nginx:
    container_name: notification-nginx

    build:
      context: ./docker/nginx
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      notification-api:
        condition: service_healthy

      notification-frontend:
        condition: service_healthy

    ports:
      - "${NGINX_PORT}:80"

    networks:
      - notification-network

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 64M
    mem_limit: 128m
    mem_reservation: 64m
    cpus: "0.5"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ==================================================
# Persistent Volumes (uniquely named)
# ==================================================
volumes:
  postgres_data:
    name: notification-postgres-data

# ==================================================
# Internal Network (uniquely named, no host access)
# ==================================================
networks:
  notification-network:
    name: notification-network
    driver: bridge

# Redis Production Configuration
# Internal-only: no host port published

# Network
bind 0.0.0.0 ::0
protected-mode no

port 6379
timeout 0

# Persistence
save 900 1
save 300 10
save 60 10000

# ACL
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG "CONFIG_b9b8f7a3e6c1d2b3a4f5e6d7c8b9a0f1"

# Logging
loglevel notice

# Memory
maxmemory 128mb
maxmemory-policy allkeys-lru
